name: Cloudflare Meta Gateway

on:
  push:
    branches: [main]
    paths:
      - "workers/meta-gateway/**"
      - ".github/workflows/cloudflare-meta-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msj-meta-gateway
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers/meta-gateway
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Ensure queue exists
        working-directory: .
        run: npx --yes wrangler@latest queues create msj-meta-events || true

      - name: Deploy gateway
        run: npx wrangler deploy
