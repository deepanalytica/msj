name: Cloudflare Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msj-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Verify
        run: |
          npm run typecheck
          npm test

      - name: Install Cloudflare adapter
        run: npm install --no-save --package-lock=false @opennextjs/cloudflare@latest wrangler@latest

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx --yes @opennextjs/cloudflare@latest build

      - name: Validate deploy credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Write runtime secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MSJ_CREDENTIALS_KEY: ${{ secrets.MSJ_CREDENTIALS_KEY }}
          MSJ_INTERNAL_SECRET: ${{ secrets.MSJ_INTERNAL_SECRET }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const names = [
            'NEXT_PUBLIC_SUPABASE_URL','NEXT_PUBLIC_SUPABASE_ANON_KEY','SUPABASE_SERVICE_ROLE_KEY',
            'MSJ_CREDENTIALS_KEY','MSJ_INTERNAL_SECRET','META_APP_SECRET','META_VERIFY_TOKEN','OPENAI_API_KEY'
          ];
          const required = names.filter(n => n !== 'OPENAI_API_KEY');
          const missing = required.filter(n => !process.env[n]);
          if (missing.length) {
            console.error('Missing runtime secrets: ' + missing.join(', '));
            process.exit(1);
          }
          const out = {};
          for (const n of names) if (process.env[n]) out[n] = process.env[n];
          fs.writeFileSync('.cloudflare-secrets.json', JSON.stringify(out), {mode:0o600});
          NODE

      - name: Deploy
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc --secrets-file .cloudflare-secrets.json

      - name: Cleanup
        if: always()
        run: rm -f .cloudflare-secrets.json
